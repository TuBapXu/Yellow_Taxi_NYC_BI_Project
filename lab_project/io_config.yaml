version: 0.1.1

default:
  POSTGRES_CONNECT_TIMEOUT: 10
  POSTGRES_CONNECTION_METHOD: direct
  POSTGRES_DBNAME: "{{ env_var('POSTGRES_DB', 'DW_DB') }}"
  POSTGRES_HOST: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
  POSTGRES_PORT: "{{ env_var('POSTGRES_PORT', '5432') }}"
  POSTGRES_USER: "{{ env_var('POSTGRES_USER', 'postgres') }}"
  POSTGRES_PASSWORD: "{{ env_var('POSTGRES_PASSWORD', 'admin123') }}"
  POSTGRES_SCHEMA: staging
