# ==============================================================================
# CẤU HÌNH DỰ ÁN DBT CHO DỰ ÁN NYC YELLOW TAXI DWH (TASK T01 - TTU)
# Quản lý toàn bộ quá trình biến đổi dữ liệu theo chuẩn Single DDS
# ==============================================================================
name: 'yellow_taxi_dwh'
version: '1.2.0'
config-version: 2

profile: 'yellow_taxi_profile'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ------------------------------------------------------------------------------
# PHÂN TẦNG VÀ CHIẾN LƯỢC MATERIALIZATION THEO THIẾT KẾ SINGLE DDS
# ------------------------------------------------------------------------------
models:
  yellow_taxi_dwh:
    # Tầng Staging (NBINH phụ trách B01, B02):
    # - stg_yellow_trips: View chuẩn hóa kiểu dữ liệu và schema drift
    # - stg_trips_flagged: View bổ sung bộ 3 cờ Usability và DataQualityFlags
    staging:
      +schema: staging
      +materialized: view

    # Tầng Marts / Single DDS:
    marts:
      # 8 Bảng chiều (STINH phụ trách S02): lưu trữ vật lý dạng Table
      dims:
        +schema: dds
        +materialized: table

      # Bảng Fact trung tâm (TTU phụ trách T02): nạp lũy tiến theo batch
      facts:
        +schema: dds
        +materialized: incremental
        +incremental_strategy: delete+insert
        +unique_key: "TripKey"

# ------------------------------------------------------------------------------
# SEEDS GIẢ LẬP CHO KIỂM THỬ B01/B02 (NBINH) - nạp vào schema staging
# Cột nghiệp vụ giữ dạng chuỗi giống hệt staging.raw_yellow_trips để kiểm thử ép kiểu
# ------------------------------------------------------------------------------
seeds:
  yellow_taxi_dwh:
    +schema: staging
    mock_yellow_trips:
      +column_types: &raw_text_cols
        source_row_number: bigint
        vendor_id: varchar(50)
        tpep_pickup_datetime: varchar(50)
        tpep_dropoff_datetime: varchar(50)
        passenger_count: varchar(50)
        trip_distance: varchar(50)
        rate_code_id: varchar(50)
        store_and_fwd_flag: varchar(50)
        pu_location_id: varchar(50)
        do_location_id: varchar(50)
        payment_type: varchar(50)
        fare_amount: varchar(50)
        extra: varchar(50)
        mta_tax: varchar(50)
        tip_amount: varchar(50)
        tolls_amount: varchar(50)
        improvement_surcharge: varchar(50)
        total_amount: varchar(50)
        congestion_surcharge: varchar(50)
        airport_fee: varchar(50)
    mock_cast_edge_cases:
      +column_types: *raw_text_cols
    # B02: ca biên DQ (tiền 5000/sai số 0.01, passenger 0/9/10, cự ly 100/âm/NULL, 24h, ngoài miền ngày, mã chưa ánh xạ)
    mock_dq_edge_cases:
      +column_types: *raw_text_cols
    mock_expected_flagged_edge:
      +column_types:
        source_file_name: varchar(255)
        source_row_number: bigint
        is_time_usable: boolean
        is_distance_usable: boolean
        is_amount_usable: boolean
        has_dq_issue: boolean
        data_quality_flags: text
        attribute_quality_flags: text
        scenario: text
    # B02: seed mapping dùng chung cho stg_trips_flagged (UNMAPPED_*) và DimVendor/DimRateCode (S02 - stinh)
    seed_vendor_mapping:
      +column_types:
        vendor_id: integer
        vendor_key: integer
        vendor_name: varchar(100)
        mapping_status: varchar(20)
        mapping_version: varchar(32)
    seed_rate_code_mapping:
      +column_types:
        rate_code_id: integer
        rate_code_key: integer
        rate_code_name: varchar(100)
        rate_group: varchar(20)
        mapping_status: varchar(20)
        mapping_version: varchar(32)
    mock_expected_stg_yellow_trips:
      +column_types:
        source_file_name: varchar(255)
        source_row_number: bigint
        expect_in_stg: boolean
        expect_quarantine_reason: varchar(100)
        expect_passenger_count: integer
        expect_store_and_fwd_flag: varchar(1)
        expect_trip_duration_seconds: numeric(20,6)
        expect_vendor_id: integer
        expect_rate_code_id: integer
        expect_trip_distance: numeric(18,6)
        expect_money_rounded_columns: text
    mock_expected_flagged:
      +column_types:
        source_row_number: bigint
        is_time_usable: boolean
        is_distance_usable: boolean
        is_amount_usable: boolean
        has_dq_issue: boolean
        data_quality_flags: text
        attribute_quality_flags: text
        pickup_date_key: integer
        dropoff_date_key: integer
        pickup_time_key: integer
        dropoff_time_key: integer
        pickup_zone_key: integer
        dropoff_zone_key: integer
        vendor_key: integer
        payment_type_key: integer
        rate_code_key: integer
        passenger_group_key: integer
        distance_band_key: integer
        scenario: text

vars:
  # true: staging đọc từ seed giả lập thay vì staging.raw_yellow_trips (dbt ... --vars '{b01_use_mock: true}')
  b01_use_mock: false
  # Miền ngày hợp lệ (Data Contract v1.2 mục 2.2 / 3.1) - bao gồm hai biên; dùng chung cho B02 và DimDate (S02)
  dq_date_domain_start: '2020-12-31'
  dq_date_domain_end: '2024-01-01'
  # Phiên bản rule DQ áp dụng đồng nhất ở stg_trips_flagged và Fact (B02)
  dq_rule_version: 'v1.2'
